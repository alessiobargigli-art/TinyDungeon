name: CI

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: node --check game.js
      - name: Verify required static files
        run: |
          test -s index.html
          test -s styles.css
          test -s game.js
          grep -q 'TinyDungeon' index.html
          grep -q 'canvas' index.html
