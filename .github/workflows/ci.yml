name: CI

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          node --check public/game.js
          node --check public/network.js
          node --check public/config.js
          node --check worker/src/index.js
      - name: Verify Cloudflare application layout
        run: |
          test -s public/index.html
          test -s public/styles.css
          test -s public/game.js
          test -s public/network.js
          test -s public/config.js
          test -s worker/wrangler.jsonc
          grep -q 'TinyDungeon' public/index.html
          grep -q 'Crea stanza' public/index.html
          grep -q '"directory": "../public"' worker/wrangler.jsonc
          grep -q 'window.location.origin' public/config.js
